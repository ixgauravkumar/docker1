<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(120deg, #fdfbfb, #ebedee);
        }
        .table-hover tbody tr:hover {
            background-color: #f1f5ff;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <!-- Header -->
    <div class="text-center mb-4">
        <h2 class="fw-bold">
            <i class="bi bi-people-fill text-primary"></i> User Management
        </h2>
        <p class="text-muted">Create • Read • Update • Delete Users</p>
    </div>

    <!-- Add User -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <i class="bi bi-person-plus-fill"></i> Add New User
        </div>
        <div class="card-body">
            <form th:action="@{/users}" method="post" class="row g-3">
                <div class="col-md-9">
                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Enter user name"
                           required>
                </div>
                <div class="col-md-3 d-grid">
                    <button class="btn btn-success">
                        <i class="bi bi-plus-circle"></i> Add User
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Users Table -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <span>
                <i class="bi bi-list-ul"></i> User List
            </span>
            <input type="text"
                   id="searchInput"
                   class="form-control w-25"
                   placeholder="Search user...">
        </div>

        <div class="card-body">
            <table class="table table-bordered table-hover text-center align-middle">
                <thead class="table-secondary">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th width="180">Actions</th>
                </tr>
                </thead>

                <tbody id="userTable">
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.name}"></td>
                    <td>
                        <a th:href="@{/users/edit/{id}(id=${user.id})}"
                           class="btn btn-warning btn-sm">
                            <i class="bi bi-pencil-square"></i> Edit
                        </a>

                        <a th:href="@{/users/delete/{id}(id=${user.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this user?')">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Client-side Search -->
<script>
    document.getElementById("searchInput").addEventListener("keyup", function () {
        let value = this.value.toLowerCase();
        let rows = document.querySelectorAll("#userTable tr");

        rows.forEach(row => {
            row.style.display = row.textContent.toLowerCase().includes(value)
                ? ""
                : "none";
        });
    });
</script>

</body>
</html>
